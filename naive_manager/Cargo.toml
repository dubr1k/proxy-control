[package]
name = "naive-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Manages the NaiveProxy credentials, lanes and egress block of the Caddyfile and accounts its CONNECT traffic."
publish = false

[[bin]]
name = "naive-manager"
path = "src/main.rs"

[dependencies]
pc_common = { path = "../pc_common" }
base64 = "0.22"
getrandom = "0.3"
libc = "0.2"
log = "0.4"
# The state file keeps the key order the Python manager wrote: maps keep insertion order.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# The accounting database: the same SQLite file, schema and pragmas as before, built in.
rusqlite = { version = "0.37", features = ["bundled"] }
# The cover-site probe speaks TLS to the private listener without verifying the chain.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
