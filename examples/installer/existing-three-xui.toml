schema = 1
host_mode = "coexist"
# Raw TLS forwarding loses client IPs. For a PROXY-aware frontend configure the
# operator bridge per docs/INSTALLER_REFERENCE.en.md; foreign routes stay unchanged.
# Для сохранения IP нужен операторский PROXY bridge: docs/INSTALLER_REFERENCE.ru.md.
profile = "core"
acme_email = "admin@example.com"
initial_user = "owner"

[domains]
panel = "panel.example.com"
mtproxy = "relay.example.com"

[three_xui]
mode = "existing"
panel_domain = "xui.example.com"
vless_tcp_domain = "vless.example.com"
vless_xhttp_domain = "xhttp.example.com"
hysteria_domain = "hy2.example.com"

[firewall]
manage_ufw = false
