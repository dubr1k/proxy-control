name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pinned Rust binaries for external black-box tests
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          cargo build --manifest-path panel/Cargo.toml --locked -p panel-web --features test-hooks
          cargo build --manifest-path installer/Cargo.toml --locked --bin proxy-control-installer
          install -D -m 0755 installer/target/debug/proxy-control-installer \
            installer/bin/linux-amd64/proxy-control-installer
      - name: Python environment
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r panel/requirements-dev.txt
      - name: Native test prerequisites
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y nginx libnginx-mod-stream jq
          test -f /usr/lib/nginx/modules/ngx_stream_module.so
          command -v nginx
          command -v node
          command -v go
          command -v google-chrome || command -v chromium
      - name: Real installer and agent in a private host namespace
        run: |
          # The default library suite ignores this privileged smoke by design; execute it
          # explicitly with real compiled binaries, never as an implicit skip.
          cargo build --manifest-path version_agent/Cargo.toml --locked --bin proxy-control-version-agent
          cargo test --manifest-path installer/Cargo.toml --locked --lib --no-run \
            --message-format=json > "$RUNNER_TEMP/installer-tests.jsonl"
          test_bin=$(jq -r 'select(.reason == "compiler-artifact" and .target.kind == ["lib"] and .profile.test and .executable != null) | .executable' \
            "$RUNNER_TEMP/installer-tests.jsonl")
          test -x "$test_bin"
          sudo env TEST_BIN="$test_bin" \
            PC_SERVICES_SMOKE_INSTALLER="$PWD/installer/target/debug/proxy-control-installer" \
            PC_SERVICES_SMOKE_AGENT="$PWD/version_agent/target/debug/proxy-control-version-agent" \
            unshare --mount --propagation private /bin/bash -euo pipefail -c '
              for dir in /etc /var/lib /run; do mount -t tmpfs tmpfs "$dir"; done
              "$TEST_BIN" adapters::services_tests::isolated_real_agent_engine_and_cli_fresh_repair_resume_smoke \
                --ignored --exact --nocapture
            ' | tee "$RUNNER_TEMP/installer-agent-smoke.log"
          grep -Fq 'test result: ok. 1 passed; 0 failed; 0 ignored;' \
            "$RUNNER_TEMP/installer-agent-smoke.log"
      - name: Ruff and full native-panel black-box tests
        run: |
          .venv/bin/ruff check .
          # The panel binary serves HTTP in a separate process; host checks also run as root
          # in this ephemeral runner. Pytest discovers the full external suite.
          docker build -f panel/Dockerfile -t mtproxy-panel:latest .
          docker build -f mieru_manager/Dockerfile -t mtproxy-mieru-manager:latest .
          sudo env PANEL_IMPL=rust PANEL_RUST_BIN="$PWD/panel/target/debug/panel" \
            PANEL_TEST_IMAGE=mtproxy-panel:latest .venv/bin/python - <<'PY'
          import sys
          import pytest

          class FullSuite:
              deselected = 0
              skipped = 0

              def pytest_deselected(self, items):
                  self.deselected += len(items)

              def pytest_collectreport(self, report):
                  if report.skipped:
                      self.skipped += 1

              def pytest_runtest_logreport(self, report):
                  if report.skipped:
                      self.skipped += 1

          guard = FullSuite()
          status = pytest.main(["-q", "-ra"], plugins=[guard])
          if guard.deselected or guard.skipped:
              print(f"Incomplete test suite: {guard.deselected} deselected, {guard.skipped} skipped", file=sys.stderr)
              raise SystemExit(1)
          raise SystemExit(status)
          PY
      - name: MTProxy bridge (Go)
        run: |
          # The toolchain the router image builds the bridge with (xray_router_manager/Dockerfile).
          docker run --rm -v "$PWD/xray_router_manager/mtproxy-bridge:/src" -w /src \
            golang:1.25.12@sha256:dbeddb5e728ea4b5ba7920574413e311025ffa42d196793857e4d160e8dfe60d \
            sh -ec 'test -z "$(gofmt -l .)"; go vet ./...; go test -race -count=1 ./...'
      - name: Every tracked shell script
        run: |
          mapfile -d '' -t shell_files < <(git ls-files -z '*.sh')
          test "${#shell_files[@]}" -gt 0
          printf '%s\n' "${shell_files[@]}"
          for script in "${shell_files[@]}"; do
            bash -n "$script"
          done
          shellcheck "${shell_files[@]}"
      - name: Documentation, notices, service units, and diff hygiene
        run: |
          .venv/bin/python scripts/check-doc-links.py
          bash scripts/dev/check-js-syntax.sh
          test -s LICENSE
          test -s THIRD_PARTY_NOTICES.md
          grep -q 'Mieru/mita' THIRD_PARTY_NOTICES.md
          grep -q 'not bundled' THIRD_PARTY_NOTICES.md
          grep -Fq 'caddy:2.11.7-builder@sha256:d842facfd63b960922e57444ff76fd8f0793a66dfdcf481af8026e1f4e6a39b4' docker/Dockerfile.caddy-naive
          grep -Fq 'github.com/caddyserver/forwardproxy@caddy2=github.com/klzgrad/forwardproxy@d62c80d3dd2c706b6b87579844d2397bddd18317' docker/Dockerfile.caddy-naive
          sudo install -d /usr/local/libexec /opt/proxy-control/version_agent/bin/linux-amd64
          sudo install -m 0755 /bin/true /usr/local/libexec/check-naive-caddy-build
          sudo install -m 0755 scripts/caddy-naive-adapt /usr/local/libexec/caddy-naive-adapt
          sudo install -m 0755 scripts/mieru-mss-clamp.sh /usr/local/libexec/mieru-mss-clamp
          sudo install -m 0755 /bin/true /usr/local/bin/caddy
          sudo install -m 0755 /bin/true /usr/bin/mita
          sudo install -m 0755 /bin/true /usr/local/bin/mieru-manager
          sudo install -m 0755 /bin/true /opt/proxy-control/version_agent/bin/linux-amd64/proxy-control-version-agent
          printf '[Unit]\nDescription=CI stub mita dependency\n[Service]\nType=oneshot\nExecStart=/bin/true\n' | sudo tee /etc/systemd/system/mita.service >/dev/null
          systemd-analyze verify deploy/*.service
          git diff --check

  dependency-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Audit every native dependency lock with pinned RustSec
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup default 1.99.0
          cargo install --locked --version '=0.22.2' cargo-audit
          mapfile -d '' -t locks < <(git ls-files -z -- '*Cargo.lock')
          test "${#locks[@]}" -gt 0
          for lock in "${locks[@]}"; do
            cargo audit --file "$lock"
          done

  native-panel:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Pinned Rust panel workspace (fmt, clippy, tests)
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.99.0
          cargo fmt --manifest-path panel/Cargo.toml --all --check
          cargo clippy --manifest-path panel/Cargo.toml --workspace --all-targets --locked -- -D warnings
          cargo test --manifest-path panel/Cargo.toml --workspace --locked

  host-crates:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Host crates (fmt, clippy, tests) in the pinned builder image
        run: |
          # Every crate of release/host-binaries.list that exists, in the image that builds the
          # shipped binaries (release/Dockerfile.host-binaries, stage `check`).
          docker buildx build --platform linux/amd64 --file release/Dockerfile.host-binaries \
            --target checked --output "type=local,dest=$RUNNER_TEMP/host-crates-checked" .

  reproducible-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Two builds of the host binaries are byte-identical
        run: |
          # Independent builds (no layer cache) in the pinned image. Compare these digests with
          # the lab's (`release/build.py --build-binaries` on ams-test) to prove that rustc
          # output does not depend on the machine either.
          python3 release/build.py --source . --build-binaries bin-a --allow-dirty
          python3 release/build.py --source . --build-binaries bin-b --allow-dirty
          cat bin-a/host-binaries.builder bin-a/host-binaries.sha256
          cmp bin-a/host-binaries.sha256 bin-b/host-binaries.sha256 \
            || { diff bin-a/host-binaries.sha256 bin-b/host-binaries.sha256 >&2; exit 1; }
      - name: Two builds of this commit are byte-identical
        run: |
          version=$(cat VERSION)
          python3 release/build.py --source . --output dist --version "$version" --allow-dirty --binaries-from bin-a
          python3 release/build.py --source . --output dist-again --version "$version" --allow-dirty --binaries-from bin-b
          cmp dist/proxy-control-v"$version".tar.gz dist-again/proxy-control-v"$version".tar.gz
          cmp dist/release-manifest.json dist-again/release-manifest.json
          cmp dist/sbom.spdx.json dist-again/sbom.spdx.json
          cmp dist/install-release.sh dist-again/install-release.sh
          cmp dist/install-release.sh.sha256 dist-again/install-release.sh.sha256
          python3 release/build.py --verify dist
      - name: The archive excludes private and lab state
        run: |
          version=$(cat VERSION)
          ! tar -tzf dist/proxy-control-v"$version".tar.gz | grep -E \
            '^proxy-control/(\.git/|\.env|secrets/|\.lab-state/|lab-results/|dist/)'
      - name: The bootstrap verifies before it dispatches
        run: |
          bash -n install-bootstrap
          shellcheck install-bootstrap

  compose-and-images:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare synthetic render inputs
        run: |
          cat > .env <<'EOF'
          MTPROXY_DOMAIN=proxy.example.com
          MTPROXY_BACKEND_PORT=18445
          MTPROXY_COVER_ROOT=/tmp/cover
          MTPROXY_LETSENCRYPT_ROOT=/tmp/letsencrypt
          NAIVE_PUBLIC_HOST=naive.example.com
          EOF
          mkdir -p secrets
          printf 'ci=0123456789abcdef0123456789abcdef\n' > secrets/users.conf
          printf 'Bearer ci-internal-token-0123456789abcdef0123456789abcdef\n' > secrets/telemt-api-token
          printf 'ci-naive-manager-token-0123456789abcdef0123456789abcdef\n' > secrets/naive-manager-token
          printf 'ci-mieru-manager-token-0123456789abcdef0123456789abcdef\n' > secrets/mieru-manager-token
          printf 'MIERU_MANAGER_TOKEN_FILE=%s\n' "$PWD/secrets/mieru-manager-token" >> .env
          for name in mcp-panel-key mcp-token xray-router-manager-token xray-router-ingress-naive xray-router-ingress-mieru awg-manager-token trusttunnel-manager-token; do
            printf 'ci-%s-placeholder\n' "$name" > "secrets/$name"
          done
      - name: Render every Compose model
        run: |
          docker compose -f compose.yaml config -q
          NAIVE_PUBLIC_HOST=naive.example.com docker compose -f compose.yaml -f compose.naive.yaml config -q
          MIERU_PUBLIC_HOST=mieru.example.com MIERU_MITA_GID=321 MIERU_MITA_BIN=/bin/true MIERU_MITA_SHA256=4aa03abde846548692dc479359fd9d6c378c0b0e3ab22f94b2c22b1e54dcdb31 docker compose -f compose.yaml -f compose.mieru.yaml config -q
          NAIVE_PUBLIC_HOST=naive.example.com MIERU_PUBLIC_HOST=mieru.example.com MIERU_MITA_GID=321 MIERU_MITA_BIN=/bin/true MIERU_MITA_SHA256=4aa03abde846548692dc479359fd9d6c378c0b0e3ab22f94b2c22b1e54dcdb31 docker compose -f compose.yaml -f compose.naive.yaml -f compose.mieru.yaml config -q
          export MCP_DOMAIN=mcp.example.com MCP_PANEL_HOST=panel.example.com
          export XRAY_ROUTER_XRAY_SHA256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          export XRAY_ROUTER_GEOIP_SHA256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          export XRAY_ROUTER_GEOSITE_SHA256=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          docker compose -f compose.yaml -f compose.mcp.yaml config -q
          docker compose -f compose.yaml -f compose.naive.yaml -f compose.xray-router.yaml config -q
          MIERU_PUBLIC_HOST=mieru.example.com MIERU_MITA_GID=321 MIERU_MITA_BIN=/bin/true MIERU_MITA_SHA256=4aa03abde846548692dc479359fd9d6c378c0b0e3ab22f94b2c22b1e54dcdb31 docker compose -f compose.yaml -f compose.naive.yaml -f compose.mieru.yaml -f compose.xray-router.yaml -f compose.mcp.yaml config -q
          mkdir -p "$RUNNER_TEMP/awg-state" "$RUNNER_TEMP/trusttunnel-state" "$RUNNER_TEMP/trusttunnel-certs"
          AMNEZIAWG_PUBLIC_HOST=awg.example.com AWG_MANAGER_TOKEN_FILE="$PWD/secrets/awg-manager-token" \
            AWG_MANAGER_STATE_DIR="$RUNNER_TEMP/awg-state" \
            docker compose -f compose.yaml -f compose.amneziawg.yaml config -q
          TT_HOSTNAME=tt.example.com TRUSTTUNNEL_PUBLIC_HOST=tt.example.com \
            TRUSTTUNNEL_MANAGER_TOKEN_FILE="$PWD/secrets/trusttunnel-manager-token" \
            TT_MANAGER_STATE_DIR="$RUNNER_TEMP/trusttunnel-state" TT_CERT_DIR="$RUNNER_TEMP/trusttunnel-certs" \
            docker compose -f compose.yaml -f compose.trusttunnel.yaml config -q
      - name: Render documented Mieru quickstart without secret contents
        run: |
          mkdir -p "$RUNNER_TEMP/mieru-render/state"
          : > "$RUNNER_TEMP/mieru-render/token"
          install -m 0755 /bin/true "$RUNNER_TEMP/mieru-render/mita"
          MTPROXY_DOMAIN=proxy.example.com \
          MTPROXY_BACKEND_PORT=18445 \
          MTPROXY_COVER_ROOT="$RUNNER_TEMP/mieru-render/cover" \
          MTPROXY_LETSENCRYPT_ROOT="$RUNNER_TEMP/mieru-render/letsencrypt" \
          MIERU_PUBLIC_HOST=mieru.example.com \
          MIERU_MITA_BIN="$RUNNER_TEMP/mieru-render/mita" \
          MIERU_MITA_SHA256=4aa03abde846548692dc479359fd9d6c378c0b0e3ab22f94b2c22b1e54dcdb31 \
          MIERU_MITA_GID=321 \
          MIERU_MANAGER_STATE_DIR="$RUNNER_TEMP/mieru-render/state" \
          MIERU_MANAGER_TOKEN_FILE="$RUNNER_TEMP/mieru-render/token" \
          docker compose --env-file /dev/null -f compose.yaml -f compose.mieru.yaml config -q
      - name: Build project images
        run: |
          NAIVE_PUBLIC_HOST=naive.example.com docker compose -f compose.yaml -f compose.naive.yaml build panel naive-manager
          MIERU_PUBLIC_HOST=mieru.example.com MIERU_MITA_GID=321 MIERU_MITA_BIN=/bin/true MIERU_MITA_SHA256=4aa03abde846548692dc479359fd9d6c378c0b0e3ab22f94b2c22b1e54dcdb31 docker compose -f compose.yaml -f compose.mieru.yaml build mieru-manager
          NAIVE_PUBLIC_HOST=naive.example.com MIERU_PUBLIC_HOST=mieru.example.com MIERU_MITA_GID=321 MIERU_MITA_BIN=/bin/true MIERU_MITA_SHA256=4aa03abde846548692dc479359fd9d6c378c0b0e3ab22f94b2c22b1e54dcdb31 docker compose -f compose.yaml -f compose.naive.yaml -f compose.mieru.yaml build panel naive-manager mieru-manager
          docker build -f xray_router_manager/Dockerfile -t proxy-control-xray-router:test .
          docker build -f mcp_server/Dockerfile -t proxy-control-mcp:test .
          test "$(docker run --rm --entrypoint id proxy-control-xray-router:test -u)" = 10006
          test "$(docker run --rm --entrypoint id proxy-control-mcp:test -u)" = 10007
      - name: Build and validate pinned Caddy
        run: |
          mkdir -p "$RUNNER_TEMP/caddy-naive"
          timeout 10m docker buildx build \
            --file docker/Dockerfile.caddy-naive \
            --output "type=local,dest=$RUNNER_TEMP/caddy-naive" .
          timeout 10s env CADDY_BIN="$RUNNER_TEMP/caddy-naive/caddy" \
            scripts/check-naive-caddy-build.sh
          if timeout 10s env CADDY_BIN=/bin/true scripts/check-naive-caddy-build.sh \
            2>"$RUNNER_TEMP/caddy-negative.log"; then
            echo 'checker accepted a non-Caddy executable' >&2
            exit 1
          fi
          grep -Fq 'refusing unpinned Caddy build' "$RUNNER_TEMP/caddy-negative.log"
