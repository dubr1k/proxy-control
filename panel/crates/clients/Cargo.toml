[package]
name = "panel-clients"
description = "The clients domain of the Proxy Control panel: client and grant rows, the client service with its audit rows and change hooks, the provisioning saga with its journal and resume, the grant lifecycle, the domain writer behind the protocol pages, the read-only import of runtime accounts, the access enforcer and the request models of the client API."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "panel_clients"

[dependencies]
base64 = "0.22"
log = "0.4"
panel-core = { path = "../core" }
panel-managers = { path = "../managers" }
panel-model = { path = "../model" }
panel-protocols = { path = "../protocols" }
panel-secrets = { path = "../secrets" }
# The same version as panel-core's; `functions` for the listing's `client_lower` (Python's
# Unicode `str.lower` registered as an SQL function).
rusqlite = { version = "0.41", features = ["bundled", "functions"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
