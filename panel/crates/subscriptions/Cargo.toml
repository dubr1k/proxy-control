[package]
name = "panel-subscriptions"
description = "Client subscriptions of the Proxy Control panel: the bearer URL with its hash and escrowed copy, the generation hook and events, the effective manifest and its ETag, the five feed formats (raw links, hand-written Clash YAML, sing-box JSON, the canonical manifest, the end-user HTML page with its CSP-pinned inline assets), the app catalogue and the compatibility matrix."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "panel_subscriptions"

[dependencies]
base64 = "0.22"
panel-clients = { path = "../clients" }
panel-core = { path = "../core" }
panel-model = { path = "../model" }
panel-protocols = { path = "../protocols" }
panel-secrets = { path = "../secrets" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"

[dev-dependencies]
panel-managers = { path = "../managers" }
