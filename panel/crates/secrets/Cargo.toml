[package]
name = "panel-secrets"
description = "Secrets and identity of the Proxy Control panel: master keyring, AES-256-GCM secret store, admin passwords, sessions, CSRF, login limiter, API keys, audit log, events, panel GUID and the stage-secret command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "panel_secrets"

[dependencies]
panel-core = { path = "../core" }
# AES-256-GCM: `ct ‖ tag` like cryptography's AESGCM. The nonce comes from getrandom below, so the
# crate's own OS-random feature stays off.
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
# argon2id with PHC strings (re-exports password-hash); salts come from getrandom below.
argon2 = { version = "0.5", default-features = false, features = ["alloc", "password-hash"] }
base64 = "0.22"
getrandom = "0.3"
# O_NOFOLLOW and errno for the keyring file and stage-secret (already in the tree through panel-core).
libc = "0.2"
sha2 = "0.10"
subtle = "2.6"
