[package]
name = "panel-core"
description = "Foundation of the Proxy Control panel: settings, SQLite boundary and migrations, Python-compatible JSON and text, error bodies, clock and identifiers."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "panel_core"

[dependencies]
base64 = "0.22"
getrandom = "0.3"
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: objects keep insertion order like Python dicts. float_roundtrip: floats parse
# correctly rounded like Python's json.loads (the default parser can be off by one ulp).
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.10"
unicode-normalization = "0.1"
