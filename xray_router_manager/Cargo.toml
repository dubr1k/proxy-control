[package]
name = "xray-router-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Renders the dedicated Xray egress router's configuration from routing intents and supervises the pinned Xray: generations, rollback, lanes, the relay, geodata and custom exits."
publish = false

[[bin]]
name = "xray-router-manager"
path = "src/main.rs"

[dependencies]
pc_common = { path = "../pc_common" }
base64 = "0.22"
getrandom = "0.3"
httparse = "1"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
# Key order of the API answers follows the Python dicts that built them; sorted output is the
# serialiser's job (src/pyjson.rs), as `json.dumps(sort_keys=True)` was.
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
# HTTPS for the geodata downloads, the WARP registration and the exit probe; TLS hellos to chain
# hops. `ring` keeps the build free of cmake; the system CA bundle is the trust store, as
# `ssl.create_default_context()` used it.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"

[profile.release]
lto = true
codegen-units = 1
strip = true
