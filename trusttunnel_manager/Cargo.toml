[package]
name = "trusttunnel-manager"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Supervises the pinned trusttunnel_endpoint and keeps its client credentials, settings and traffic totals."
publish = false

[[bin]]
name = "trusttunnel-manager"
path = "src/main.rs"

[dependencies]
pc_common = { path = "../pc_common" }
base64 = "0.22"
getrandom = "0.3"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
toml = "0.9"

[profile.release]
lto = true
codegen-units = 1
strip = true
