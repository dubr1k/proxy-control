name: mtproxy

services:
  mieru-manager:
    container_name: proxy-control-mieru-manager
    build:
      context: .
      dockerfile: mieru_manager/Dockerfile
    restart: unless-stopped
    # Host network (v0.4): the egress API checks the WARP proxy-mode endpoint on the host's
    # loopback before writing it into mita's config. The manager listens on its Unix socket
    # only, so no port of it becomes reachable; the other restrictions below stay.
    network_mode: host
    user: "10005:10005"
    group_add:
      - ${MIERU_MITA_GID:?set the host mita socket group GID}
    environment:
      MIERU_PUBLIC_HOST: ${MIERU_PUBLIC_HOST:?set an explicit public host}
      MIERU_MANAGER_TOKEN_FILE: /run/secrets/mieru-manager-token
      MIERU_MITA_SHA256: ${MIERU_MITA_SHA256:?set the pinned host mita binary SHA-256}
      MIERU_SOCKET_MODE: "660"
      TMPDIR: /run/mieru-manager
      MITA_UDS_PATH: /run/mita/mita.sock
      # The host's WARP proxy-mode endpoint the egress API may route the service through
      # (v0.4 routing); empty = no `warp` provider on this node. Written by the installer.
      MIERU_EGRESS_WARP: ${MIERU_EGRESS_WARP:-}
    secrets: [mieru-manager-token]
    volumes:
      - type: bind
        source: ${MIERU_MITA_BIN:-/usr/bin/mita}
        target: /usr/bin/mita
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /run/mita
        target: /run/mita
        read_only: true
        bind:
          create_host_path: false
      # Mandatory host preflight: sudo ./scripts/prepare-mieru-state.sh prepare "$MIERU_MANAGER_STATE_DIR"
      - type: bind
        source: ${MIERU_MANAGER_STATE_DIR:-/var/lib/mieru-manager}
        target: /var/lib/mieru-manager
        bind:
          create_host_path: false
      - mieru-manager-run:/run/mieru-manager
    read_only: true
    tmpfs:
      # Owned by the manager user (10005:10005), same reason as the panel's /tmp in compose.yaml.
      - /tmp:size=8m,mode=1777,uid=10005,gid=10005
    pids_limit: 128
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-m", "mieru_manager.healthcheck"]
      interval: 20s
      timeout: 3s
      retries: 3
      start_period: 10s

  panel:
    depends_on:
      mieru-manager:
        condition: service_healthy
    group_add:
      - "10005"
    environment:
      MIERU_ENABLED: "true"
      MIERU_MANAGER_TOKEN_SOURCE: /run/secrets/mieru-manager-token
      MIERU_MANAGER_SOCKET: /run/mieru-manager/manager.sock
      PANEL_SUPPLEMENTARY_GROUPS: "10001,10005"
    secrets: [mieru-manager-token]
    volumes:
      - mieru-manager-run:/run/mieru-manager:ro

secrets:
  mieru-manager-token:
    file: ${MIERU_MANAGER_TOKEN_FILE:?set the prepared host Mieru token path}
volumes:
  mieru-manager-run:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: uid=10005,gid=10005,mode=0770
