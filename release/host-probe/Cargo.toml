[package]
name = "proxy-control-host-probe"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Stand-in host binary that proves the reproducible static release build until the installer crate exists."
publish = false

[[bin]]
name = "proxy-control-host-probe"
path = "src/main.rs"

[dependencies]
# The same shapes the real host binaries have: a path dependency on the shared crate, crates
# from the registry, and ring's C and assembly (the TLS backend the installer and the agent use).
pc_common = { path = "../../pc_common" }
ring = "0.17"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
