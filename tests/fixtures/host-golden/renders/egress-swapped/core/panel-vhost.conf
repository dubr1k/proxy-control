server { listen 127.0.0.1:8443 ssl; listen unix:/run/proxy-control-panel-tls.sock ssl proxy_protocol; set_real_ip_from unix:; real_ip_header proxy_protocol; server_name panel.example.com; ssl_certificate /etc/letsencrypt/live/relay.example.com/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem; location ^~ /s/ { access_log off; return 404; } location / { proxy_pass http://127.0.0.1:8787; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $remote_addr; } }
server { listen 127.0.0.1:8443 ssl; listen unix:/run/proxy-control-panel-tls.sock ssl proxy_protocol; set_real_ip_from unix:; real_ip_header proxy_protocol; server_name mcp.example.com; ssl_certificate /etc/letsencrypt/live/relay.example.com/fullchain.pem; ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem; access_log off; location = /healthz { return 404; } location /mcp { proxy_pass http://127.0.0.1:8793; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $remote_addr; proxy_buffering off; proxy_read_timeout 3600s; } location / { return 404; } }
