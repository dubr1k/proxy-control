# BEGIN PROXY-CONTROL ACME certificate.proxy-control
server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/mcp.example.com;
        try_files $uri =404;
    }
    location / { return 404; }
}
server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/panel.example.com;
        try_files $uri =404;
    }
    location / { return 404; }
}
server {
    listen 80;
    listen [::]:80;
    server_name relay.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/relay.example.com;
        try_files $uri =404;
    }
    location / { return 404; }
}
# END PROXY-CONTROL ACME certificate.proxy-control
