# BEGIN PROXY-CONTROL ACME certificate.trusttunnel
server {
    listen 80;
    listen [::]:80;
    server_name gate.example.org;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/gate.example.org;
        try_files $uri =404;
    }
    location / { return 404; }
}
# END PROXY-CONTROL ACME certificate.trusttunnel
