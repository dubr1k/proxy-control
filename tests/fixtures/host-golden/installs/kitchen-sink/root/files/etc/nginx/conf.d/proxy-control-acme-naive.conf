# BEGIN PROXY-CONTROL ACME certificate.naive
server {
    listen 80;
    listen [::]:80;
    server_name edge.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/edge.example.com;
        try_files $uri =404;
    }
    location / { return 404; }
}
# END PROXY-CONTROL ACME certificate.naive
