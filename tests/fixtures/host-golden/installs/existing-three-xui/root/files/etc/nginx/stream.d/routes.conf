map $ssl_preread_server_name $sni_backend {
    legacy.example.net 127.0.0.1:10443;
    # BEGIN PROXY-CONTROL ROUTES nginx.routes
    relay.example.com 127.0.0.1:8445;
    panel.example.com 127.0.0.1:8443;
    vless.example.com 127.0.0.1:8449;
    xhttp.example.com 127.0.0.1:8450;
    # END PROXY-CONTROL ROUTES nginx.routes
    default 127.0.0.1:10443;
}
server {
    listen 443;
    listen [::]:443;
    ssl_preread on;
    proxy_pass $sni_backend;
}
