# BEGIN PROXY-CONTROL ACME certificate.three-xui-subscription
server {
    listen 80;
    listen [::]:80;
    server_name xui-sub.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/xui-sub.example.com;
        try_files $uri =404;
    }
    location / { return 404; }
}
# END PROXY-CONTROL ACME certificate.three-xui-subscription
