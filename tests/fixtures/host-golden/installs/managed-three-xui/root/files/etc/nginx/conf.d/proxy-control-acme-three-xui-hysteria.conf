# BEGIN PROXY-CONTROL ACME certificate.three-xui-hysteria
server {
    listen 80;
    listen [::]:80;
    server_name hy2.example.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/hy2.example.com;
        try_files $uri =404;
    }
    location / { return 404; }
}
# END PROXY-CONTROL ACME certificate.three-xui-hysteria
