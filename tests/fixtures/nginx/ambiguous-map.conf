# configuration file /etc/nginx/nginx.conf:
events {}
stream { include /etc/nginx/stream.d/*.conf; }
# configuration file /etc/nginx/stream.d/routes.conf:
map $ssl_preread_server_name $first_backend {
    default 127.0.0.1:8443;
}
map $ssl_preread_server_name $second_backend {
    default 127.0.0.1:9443;
}
server {
    listen 0.0.0.0:443;
    ssl_preread on;
    proxy_pass $first_backend;
}
server {
    listen [::]:443;
    ssl_preread on;
    proxy_pass $second_backend;
}
