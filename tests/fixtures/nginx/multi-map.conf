# configuration file /etc/nginx/nginx.conf:
events {}
stream {
    include /etc/nginx/stream.d/*.conf;
}
# configuration file /etc/nginx/stream.d/unrelated.conf:
map $remote_addr $rate_backend {
    default 127.0.0.1:9000;
}
map $ssl_preread_server_name $unused_backend {
    default 127.0.0.1:9001;
}
# configuration file /etc/nginx/stream.d/routes.conf:
map "$ssl_preread_server_name" '$proxy_control_backend' {
    # braces and semicolons in comments do not alter the grammar: { ; }
    "vpn.example.com" "127.0.0.1:10443";
    default 127.0.0.1:8443;
}
server {
    listen "[::]:443" ssl;
    ssl_preread on;
    proxy_pass "$proxy_control_backend";
}
