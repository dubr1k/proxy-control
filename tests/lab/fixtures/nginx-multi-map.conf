# Ambiguous shared-443 topology: two stream maps feed one listener.
# The installer must select the map that actually reaches the listener and
# refuse to guess when more than one candidate matches.
map $ssl_preread_server_name $shared_backend {
    old-xray.lab.test 127.0.0.1:9443;
    default           127.0.0.1:9443;
}

map $ssl_preread_server_name $legacy_backend {
    legacy.lab.test 127.0.0.1:9444;
    default         127.0.0.1:9444;
}

server {
    listen 443;
    proxy_pass $shared_backend;
    ssl_preread on;
}
