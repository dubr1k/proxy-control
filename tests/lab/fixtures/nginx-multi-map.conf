# A second stream listener with its own map, added beside the shared 443
# router. More than one candidate map now exists, so the installer must select
# the one that actually feeds the 443 listener rather than guessing, and must
# refuse if the choice is not provable.
map $ssl_preread_server_name $legacy_backend {
    legacy.lab.test 127.0.0.1:9444;
    default         127.0.0.1:9444;
}

server {
    listen 8443;
    proxy_pass $legacy_backend;
    ssl_preread on;
}
